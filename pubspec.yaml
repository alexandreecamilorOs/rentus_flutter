name: rentus_flutter
description: "Versión Flutter de las vistas de Rentus Mobile"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.1.0
  provider: ^6.1.5+1
  flutter_screenutil: ^5.9.3
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2
  flutter_animate: ^4.5.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.13.1
  image: ^4.8.0

flutter_native_splash:
  color: "#0D0A09"
  android_12:
    color: "#0D0A09"
  android: true
  ios: true
  web: false

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/core/theme/launcher_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D0A09"
  adaptive_icon_foreground: "lib/core/theme/launcher_icon.png"

flutter:
  uses-material-design: true
  assets:
    - lib/core/theme/logo.png
